<!doctype html>
<html lang="en" data-color-mode="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coordination: preview</title>
<style>
  /* A stand-in for what Buzz supplies inside the app: its colour tokens, card surface and plain
     element styles. Approximations for the preview only; in Buzz the app's own values apply. */
  :root {
    --surface-base: #eceff4; --surface-panel: #ffffff;
    --text-standard: #2e3440; --text-subtle: #4c566a;
    --border-standard: #d8dee9; --space-panel-inset: 16px; --space-2: 8px;
    color-scheme: light;
  }
  :root[data-color-mode="dark"] {
    --surface-base: #111110; --surface-panel: #1a1a19;
    --text-standard: #e5e9f0; --text-subtle: #a3abb8;
    --border-standard: #34383f;
    color-scheme: dark;
  }
  html, body { margin: 0; background: var(--surface-base); color: var(--text-standard); }
  body { font: 14px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  h1 { font-size: 22px; font-weight: 600; } h2 { font-size: 17px; font-weight: 600; } h3 { font-size: 14px; font-weight: 600; }
  .ui-card { background: var(--surface-panel); border: 1px solid var(--border-standard); border-radius: 8px; }
  button, select {
    font: inherit; color: var(--text-standard); background: var(--surface-panel);
    border: 1px solid var(--border-standard); border-radius: 4px; padding: 5px 10px; cursor: pointer;
  }
  button[aria-pressed="true"] { background: var(--text-standard); color: var(--surface-panel); }
  .preview-note { padding: 6px 16px; font-size: 12px; color: var(--text-subtle); border-bottom: 1px solid var(--border-standard); }
  .preview-panel { width: 440px; max-width: 100%; margin: 16px auto; height: calc(100vh - 80px); overflow: hidden; }
</style>
</head>
<body>
<div class="preview-note">Preview outside Buzz, with invented channels. Not real data.</div>
<div id="root"></div>
<script type="module" src="out/preview.js"></script>
</body>
</html>
